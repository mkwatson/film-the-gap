<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Private intent becomes public proof and reversible commerce</title>
  <desc id="description">A five-step flow from a private agent through a native WebMCP page, a human host camera, a Cloudflare evidence authority, and a separate UCP merchant. Only evidence requirements and reviewed public facts cross boundaries.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="15%" r="90%">
      <stop offset="0" stop-color="#123328" />
      <stop offset="0.46" stop-color="#07130f" />
      <stop offset="1" stop-color="#040806" />
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102019" />
      <stop offset="1" stop-color="#09100d" />
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9df5d0" />
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 4px; }
      .title { font-size: 72px; font-weight: 760; letter-spacing: -3.2px; }
      .step { font-size: 15px; font-weight: 760; letter-spacing: 2.5px; }
      .node-title { font-size: 30px; font-weight: 730; letter-spacing: -0.8px; }
      .body { font-size: 20px; font-weight: 480; }
      .receipt { font-size: 16px; font-weight: 650; letter-spacing: 0.2px; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#glow)" />
  <circle cx="960" cy="545" r="430" fill="none" stroke="#a9ffe2" stroke-opacity="0.045" stroke-width="120" filter="url(#softGlow)" />

  <text x="80" y="96" class="sans eyebrow" fill="#a9ffe2">ONE AUDITABLE ACTION · FIVE OPEN-WEB BOUNDARIES</text>
  <text x="80" y="192" class="sans title" fill="#f3f8f5">Private intent → public proof → reversible commerce</text>
  <text x="82" y="246" class="sans body" fill="#93a99f">The agent does not know the physical truth. The page does not learn the buyer’s private ceiling.</text>

  <g fill="none" stroke="#9df5d0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 380 505 H 425" />
    <path d="M 745 505 H 790" />
    <path d="M 1110 505 H 1155" />
    <path d="M 1475 505 H 1520" />
  </g>

  <g transform="translate(60 335)">
    <rect width="320" height="340" rx="28" fill="url(#card)" stroke="#9b87ff" stroke-opacity="0.55" stroke-width="2" />
    <circle cx="44" cy="48" r="21" fill="#9b87ff" fill-opacity="0.15" stroke="#9b87ff" stroke-opacity="0.65" />
    <text x="44" y="54" class="mono step" fill="#c8bcff" text-anchor="middle">01</text>
    <text x="28" y="104" class="mono step" fill="#b9acf9">PRIVATE</text>
    <text x="28" y="148" class="sans node-title" fill="#f4f3fa">Private agent</text>
    <text x="28" y="198" class="sans body" fill="#aeb7b3">Ceiling, urgency, identity,</text>
    <text x="28" y="228" class="sans body" fill="#aeb7b3">and wider context stay here.</text>
    <rect x="28" y="274" width="264" height="42" rx="12" fill="#9b87ff" fill-opacity="0.1" stroke="#9b87ff" stroke-opacity="0.32" />
    <text x="46" y="301" class="mono receipt" fill="#c8bcff">never sent to seller</text>
  </g>

  <g transform="translate(425 335)">
    <rect width="320" height="340" rx="28" fill="url(#card)" stroke="#a9ffe2" stroke-opacity="0.7" stroke-width="2" />
    <circle cx="44" cy="48" r="21" fill="#a9ffe2" fill-opacity="0.13" stroke="#a9ffe2" stroke-opacity="0.7" />
    <text x="44" y="54" class="mono step" fill="#a9ffe2" text-anchor="middle">02</text>
    <text x="28" y="104" class="mono step" fill="#8af2cb">NATIVE WEBMCP</text>
    <text x="28" y="148" class="sans node-title" fill="#f4f8f6">Buyer page</text>
    <text x="28" y="198" class="sans body" fill="#aeb7b3">Exposes only the tools safe</text>
    <text x="28" y="228" class="sans body" fill="#aeb7b3">for the visible state now.</text>
    <rect x="28" y="274" width="264" height="42" rx="12" fill="#a9ffe2" fill-opacity="0.09" stroke="#a9ffe2" stroke-opacity="0.3" />
    <text x="46" y="301" class="mono receipt" fill="#a9ffe2">2 → 3 → 2 → 3 tools</text>
  </g>

  <g transform="translate(790 335)">
    <rect width="320" height="340" rx="28" fill="url(#card)" stroke="#ffd36d" stroke-opacity="0.68" stroke-width="2" />
    <circle cx="44" cy="48" r="21" fill="#ffd36d" fill-opacity="0.13" stroke="#ffd36d" stroke-opacity="0.7" />
    <text x="44" y="54" class="mono step" fill="#ffd36d" text-anchor="middle">03</text>
    <text x="28" y="104" class="mono step" fill="#ffd36d">HUMAN SENSOR</text>
    <text x="28" y="148" class="sans node-title" fill="#f8f5ed">Host camera</text>
    <text x="28" y="198" class="sans body" fill="#b9b6aa">One normalized request.</text>
    <text x="28" y="228" class="sans body" fill="#b9b6aa">One selected, reviewed frame.</text>
    <rect x="28" y="274" width="264" height="42" rx="12" fill="#ffd36d" fill-opacity="0.08" stroke="#ffd36d" stroke-opacity="0.3" />
    <text x="46" y="301" class="mono receipt" fill="#ffe19b">8 decisions · 1 answer</text>
  </g>

  <g transform="translate(1155 335)">
    <rect width="320" height="340" rx="28" fill="url(#card)" stroke="#5de0e6" stroke-opacity="0.62" stroke-width="2" />
    <circle cx="44" cy="48" r="21" fill="#5de0e6" fill-opacity="0.12" stroke="#5de0e6" stroke-opacity="0.68" />
    <text x="44" y="54" class="mono step" fill="#87edf1" text-anchor="middle">04</text>
    <text x="28" y="104" class="mono step" fill="#87edf1">AUTHORITY</text>
    <text x="28" y="148" class="sans node-title" fill="#eff9f8">Evidence room</text>
    <text x="28" y="198" class="sans body" fill="#aababa">Roles, revisions, replay safety,</text>
    <text x="28" y="228" class="sans body" fill="#aababa">and the private handoff.</text>
    <rect x="28" y="274" width="264" height="42" rx="12" fill="#5de0e6" fill-opacity="0.08" stroke="#5de0e6" stroke-opacity="0.28" />
    <text x="46" y="301" class="mono receipt" fill="#91f5f7">evidence changes capability</text>
  </g>

  <g transform="translate(1520 335)">
    <rect width="340" height="340" rx="28" fill="url(#card)" stroke="#b69cff" stroke-opacity="0.65" stroke-width="2" />
    <circle cx="44" cy="48" r="21" fill="#b69cff" fill-opacity="0.13" stroke="#b69cff" stroke-opacity="0.7" />
    <text x="44" y="54" class="mono step" fill="#d3c7ff" text-anchor="middle">05</text>
    <text x="28" y="104" class="mono step" fill="#c7b7ff">SEPARATE ORIGIN</text>
    <text x="28" y="148" class="sans node-title" fill="#f5f2ff">UCP merchant</text>
    <text x="28" y="198" class="sans body" fill="#b5afc2">$375 + $48 = $423.</text>
    <text x="28" y="228" class="sans body" fill="#b5afc2">Inspect or cancel—never pay.</text>
    <rect x="28" y="274" width="284" height="42" rx="12" fill="#b69cff" fill-opacity="0.09" stroke="#b69cff" stroke-opacity="0.3" />
    <text x="46" y="301" class="mono receipt" fill="#d3c7ff">merchant owns the Cart</text>
  </g>

  <rect x="220" y="760" width="1480" height="94" rx="24" fill="#a9ffe2" fill-opacity="0.055" stroke="#a9ffe2" stroke-opacity="0.2" />
  <text x="960" y="818" class="sans node-title" fill="#e7f6ef" text-anchor="middle">A physical fact makes a new action safe—and the page registers it.</text>

  <line x1="80" y1="934" x2="1840" y2="934" stroke="#a9ffe2" stroke-opacity="0.16" />
  <text x="960" y="995" class="mono eyebrow" fill="#8cebc6" text-anchor="middle">NO BUYER IDENTITY · NO PRIVATE CEILING · NO PAYMENT CROSSES THE BOUNDARY</text>
</svg>
