<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">ChatGPT asks someone to film missing product evidence once, then reuses it</title>
  <desc id="description">A five-step flow from ChatGPT identifying an evidence gap, through native WebMCP mission creation and a contributor phone recording, to human-reviewed AI analysis and a timestamped result reused for later matching questions.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="8%" r="95%">
      <stop offset="0" stop-color="#14352b" />
      <stop offset="0.5" stop-color="#081510" />
      <stop offset="1" stop-color="#040806" />
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11231c" />
      <stop offset="1" stop-color="#09110d" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9df5d0" />
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .eyebrow { font-size: 18px; font-weight: 740; letter-spacing: 3.4px; }
      .title { font-size: 68px; font-weight: 760; letter-spacing: -3px; }
      .subtitle { font-size: 22px; font-weight: 470; }
      .step { font-size: 14px; font-weight: 760; letter-spacing: 2.2px; }
      .node-title { font-size: 29px; font-weight: 730; letter-spacing: -0.8px; }
      .body { font-size: 19px; font-weight: 480; }
      .receipt { font-size: 15px; font-weight: 650; letter-spacing: 0.1px; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)" />
  <circle cx="960" cy="520" r="450" fill="none" stroke="#a9ffe2" stroke-opacity="0.04" stroke-width="130" filter="url(#glow)" />

  <text x="80" y="88" class="sans eyebrow" fill="#9df5d0">QUESTION → NEW EVIDENCE → COMPOUNDING ANSWERS</text>
  <text x="80" y="180" class="sans title" fill="#f3f8f5">Film the missing proof once. Reuse it.</text>
  <text x="82" y="232" class="sans subtitle" fill="#9eb2aa">Native WebMCP identifies one missing fact; a person reviews the proof; later agents find it first.</text>

  <g fill="none" stroke="#9df5d0" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M 378 505 H 423" />
    <path d="M 743 505 H 788" />
    <path d="M 1108 505 H 1153" />
    <path d="M 1473 505 H 1518" />
  </g>

  <g transform="translate(58 322)">
    <rect width="320" height="366" rx="28" fill="url(#card)" stroke="#9b87ff" stroke-opacity="0.62" stroke-width="2" />
    <circle cx="44" cy="48" r="21" fill="#9b87ff" fill-opacity="0.15" stroke="#9b87ff" stroke-opacity="0.68" />
    <text x="44" y="54" class="mono step" fill="#d1c8ff" text-anchor="middle">01</text>
    <text x="28" y="104" class="mono step" fill="#b9acf9">AGENT</text>
    <text x="28" y="148" class="sans node-title" fill="#f5f3fb">ChatGPT</text>
    <text x="28" y="198" class="sans body" fill="#b3b9b6">Finds the exact question</text>
    <text x="28" y="228" class="sans body" fill="#b3b9b6">the current web cannot prove.</text>
    <rect x="28" y="294" width="264" height="44" rx="12" fill="#9b87ff" fill-opacity="0.1" stroke="#9b87ff" stroke-opacity="0.32" />
    <text x="46" y="322" class="mono receipt" fill="#d1c8ff">answer: insufficient</text>
  </g>

  <g transform="translate(423 322)">
    <rect width="320" height="366" rx="28" fill="url(#card)" stroke="#a9ffe2" stroke-opacity="0.72" stroke-width="2" />
    <circle cx="44" cy="48" r="21" fill="#a9ffe2" fill-opacity="0.13" stroke="#a9ffe2" stroke-opacity="0.72" />
    <text x="44" y="54" class="mono step" fill="#a9ffe2" text-anchor="middle">02</text>
    <text x="28" y="104" class="mono step" fill="#8af2cb">NATIVE WEBMCP</text>
    <text x="28" y="148" class="sans node-title" fill="#f4f8f6">Evidence page</text>
    <text x="28" y="198" class="sans body" fill="#b3b9b6">Exposes the one action valid</text>
    <text x="28" y="228" class="sans body" fill="#b3b9b6">for the live evidence state.</text>
    <rect x="28" y="294" width="264" height="44" rx="12" fill="#a9ffe2" fill-opacity="0.09" stroke="#a9ffe2" stroke-opacity="0.3" />
    <text x="46" y="322" class="mono receipt" fill="#a9ffe2">create filming mission</text>
  </g>

  <g transform="translate(788 322)">
    <rect width="320" height="366" rx="28" fill="url(#card)" stroke="#ffd36d" stroke-opacity="0.7" stroke-width="2" />
    <circle cx="44" cy="48" r="21" fill="#ffd36d" fill-opacity="0.13" stroke="#ffd36d" stroke-opacity="0.72" />
    <text x="44" y="54" class="mono step" fill="#ffd36d" text-anchor="middle">03</text>
    <text x="28" y="104" class="mono step" fill="#ffd36d">HUMAN SENSOR</text>
    <text x="28" y="148" class="sans node-title" fill="#f8f5ed">Contributor phone</text>
    <text x="28" y="198" class="sans body" fill="#bbb8ac">Records one bounded,</text>
    <text x="28" y="228" class="sans body" fill="#bbb8ac">continuous physical test.</text>
    <rect x="28" y="294" width="264" height="44" rx="12" fill="#ffd36d" fill-opacity="0.08" stroke="#ffd36d" stroke-opacity="0.3" />
    <text x="46" y="322" class="mono receipt" fill="#ffe19b">no account · exact mission</text>
  </g>

  <g transform="translate(1153 322)">
    <rect width="320" height="366" rx="28" fill="url(#card)" stroke="#5de0e6" stroke-opacity="0.65" stroke-width="2" />
    <circle cx="44" cy="48" r="21" fill="#5de0e6" fill-opacity="0.12" stroke="#5de0e6" stroke-opacity="0.7" />
    <text x="44" y="54" class="mono step" fill="#87edf1" text-anchor="middle">04</text>
    <text x="28" y="104" class="mono step" fill="#87edf1">REVIEW GATE</text>
    <text x="28" y="148" class="sans node-title" fill="#eff9f8">AI + person</text>
    <text x="28" y="198" class="sans body" fill="#afbbbb">AI proposes a timestamp;</text>
    <text x="28" y="228" class="sans body" fill="#afbbbb">the contributor decides.</text>
    <rect x="28" y="294" width="264" height="44" rx="12" fill="#5de0e6" fill-opacity="0.08" stroke="#5de0e6" stroke-opacity="0.28" />
    <text x="46" y="322" class="mono receipt" fill="#91f5f7">proposal ≠ publication</text>
  </g>

  <g transform="translate(1518 322)">
    <rect width="344" height="366" rx="28" fill="url(#card)" stroke="#b69cff" stroke-opacity="0.68" stroke-width="2" />
    <circle cx="44" cy="48" r="21" fill="#b69cff" fill-opacity="0.13" stroke="#b69cff" stroke-opacity="0.72" />
    <text x="44" y="54" class="mono step" fill="#d3c7ff" text-anchor="middle">05</text>
    <text x="28" y="104" class="mono step" fill="#c7b7ff">EVIDENCE NETWORK</text>
    <text x="28" y="148" class="sans node-title" fill="#f5f2ff">Cited result</text>
    <text x="28" y="198" class="sans body" fill="#b9b2c4">The first answer changes;</text>
    <text x="28" y="228" class="sans body" fill="#b9b2c4">later matching questions reuse it.</text>
    <rect x="28" y="294" width="288" height="44" rx="12" fill="#b69cff" fill-opacity="0.09" stroke="#b69cff" stroke-opacity="0.3" />
    <text x="46" y="322" class="mono receipt" fill="#d3c7ff">D1 receipt · no new mission</text>
  </g>

  <rect x="210" y="758" width="1500" height="112" rx="24" fill="#a9ffe2" fill-opacity="0.055" stroke="#a9ffe2" stroke-opacity="0.22" />
  <text x="960" y="808" class="sans node-title" fill="#e7f6ef" text-anchor="middle">The agent identifies the gap. A person films once. The evidence keeps answering.</text>
  <text x="960" y="843" class="mono receipt" fill="#8cebc6" text-anchor="middle">INSPECT → MISSION → PHONE → HUMAN REVIEW → ANSWER DIFF → REUSE</text>

  <line x1="80" y1="934" x2="1840" y2="934" stroke="#a9ffe2" stroke-opacity="0.16" />
  <text x="960" y="982" class="sans subtitle" fill="#aebeb7" text-anchor="middle">Vercel: Next.js + AI Gateway · Cloudflare: Durable Object + Stream + D1 + Cron</text>
  <text x="960" y="1023" class="mono eyebrow" fill="#8cebc6" text-anchor="middle">THE MODEL PROPOSES · THE HUMAN PUBLISHES · THE NETWORK REUSES EXACT EVIDENCE</text>
</svg>
